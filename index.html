<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Downloading Latest HAND Firmware...</title>
</head>
<body>
    <p>Detecting latest version... Your download will begin shortly.</p>

    <script>
        // --- CONFIGURATION ---
        const OWNER = "Timberscope";
        const REPO = "HAND-V1-Firmware";
        // ---------------------

        async function redirectToLatestBin() {
            try {
                // Fetch release details directly from the public GitHub API
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`);
                if (!response.ok) throw new Error('Network response failure');
                
                const data = await response.json();
                
                // Scan the release assets to find the first file ending with .bin
                const binAsset = data.assets.find(asset => asset.name.endsWith('.bin'));

                if (binAsset && binAsset.browser_download_url) {
                    // Instantly forward the user to the absolute download URL
                    window.location.href = binAsset.browser_download_url;
                } else {
                    document.body.innerHTML = "<p>Error: No .bin asset found in the latest release.</p>";
                }
            } catch (error) {
                console.error(error);
                document.body.innerHTML = "<p>Error fetching the latest update. Please try again later.</p>";
            }
        }

        // Trigger on page load
        redirectToLatestBin();
    </script>
</body>
</html>
